<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обложки профилей — Финдир.Москва</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Одна обложка на три площадки: FL.ru, Kwork, LinkedIn.

   Визуальная система НЕ новая — снята с обложки TenChat
   (portfolio/tenchat/oblozhka-tenchat.html), та в свою очередь с боевых карточек
   канала (content-factory/templates/stil.css). Смысл переноса: заказчик, который
   видел профиль на одной площадке, узнаёт его на другой.

   ⛔ ПРАВИЛО ТЕКСТА (замечание Дмитрия 10.08.2026, перенесено дословно):
   в обложку НЕ СТАВИТЬ факты, которые стареют сами. «16 лет опыта» через год
   становится враньём, а картинку никто не вспомнит перерисовать. Годится только
   то, что растёт («30+ сделок», «200+ млрд ₽» — занижение остаётся правдой)
   и то, что вне времени («смотрю взглядом банкира»).
   ⛔ Не годится: возраст, стаж, «с 2010 года», должность, число подписчиков.

   ⛔ ЗАПРЕТНАЯ ЗОНА АВАТАРА своя у каждой площадки — аватар накрывает угол обложки.
   Задана переменными --av-w / --av-h, от них считается левый отступ колонки.
   Значения не из методичек, а из наблюдаемой геометрии страниц; где неизвестно
   точно — взят запас в бо́льшую сторону, потому что ошибка «отступил лишнего»
   стоит пустоты, а ошибка «отступил мало» стоит перекрытого текста.

   ⚠️ Kwork режет обложку по бокам: держим значимое в центральных ~65 % ширины
   (замер PEcf03: урок обещал 2000×660, реальность — 1920×226 с обрезкой).
   ───────────────────────────────────────────────────────────────────────── */

:root{
  /* палитра FinDir — эталон stil.css, не трогать без правки эталона */
  --fon:      #15181e;
  --fon-verh: #171a1e;
  --yantar:   #c7a35a;
  --tekst:    #f4efe6;
  --seryy:    #8c92a0;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}

.holst{
  position:relative; overflow:hidden;
  background:
    radial-gradient(120% 190% at 88% 30%, rgba(199,163,90,.10) 0%, rgba(199,163,90,0) 62%),
    linear-gradient(100deg, #12151a 0%, var(--fon) 42%, var(--fon-verh) 78%, #1b1f27 100%);
  color:var(--tekst);
  -webkit-font-smoothing:antialiased;
  font-family:"PT Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
}

/* Хребет — вертикальная янтарная линия на границе зоны аватара. Не украшение:
   она объясняет пустоту слева и оформляет её как место под фотографию. */
.hrebet{
  position:absolute; left:var(--hrebet); top:0; bottom:0; width:2px;
  background:linear-gradient(180deg,
    rgba(199,163,90,0) 0%, rgba(199,163,90,.62) 26%,
    rgba(199,163,90,.62) 74%, rgba(199,163,90,0) 100%);
}

.kolonka{
  position:absolute;
  left:calc(var(--hrebet) + var(--otstup));
  right:var(--pole-pravo);
  top:var(--pole-verh); bottom:var(--pole-niz);
  display:flex; flex-direction:column;
}

.metka{
  font-family:"PT Mono", Menlo, monospace;
  font-size:var(--kegl-metka); letter-spacing:.185em; text-transform:uppercase;
  display:flex; align-items:center; white-space:nowrap;
}
.metka::before{
  content:""; width:.5em; height:.5em; border-radius:50%;
  background:var(--yantar); flex:none; margin-right:.85em;
}
.metka .rol{ color:var(--yantar) }
.metka .kanal{ color:var(--seryy); margin-left:.55em }

.tezis{
  flex:1; display:flex; flex-direction:column; justify-content:center;
  font-family:"PT Serif", Georgia, serif; font-weight:700;
  font-size:var(--kegl-tezis); line-height:1.17; letter-spacing:-.008em;
  overflow-wrap:anywhere;
}
.tezis .vtoraya{ color:var(--yantar); display:block }

/* Глиф между половинами тезиса — тот же элемент, что на карточках канала.
   Отыгрывает поворот фразы вместо знака препинания: строка не должна
   начинаться со служебного слова. */
.glif{ display:flex; align-items:flex-end; gap:var(--glif-gap);
       height:var(--glif-h); margin:var(--glif-pole) }
.glif i{ width:var(--glif-w); background:var(--yantar);
         border-radius:2px; display:block; flex:none }

.niz{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:26px; white-space:nowrap;
}
.delo{ font-size:var(--kegl-delo); color:rgba(244,239,230,.82) }
.masshtab{
  font-family:"PT Mono", Menlo, monospace;
  font-size:var(--kegl-masshtab); letter-spacing:.04em; text-transform:uppercase;
  color:var(--seryy);
}
.masshtab b{ color:var(--tekst); font-weight:400 }
.masshtab .tochka{ color:#3d4450; margin:0 .32em }

/* ── FL.ru: 960×200 CSS → 1920×400 PNG ────────────────────────────────────
   Аватар на карточке профиля стоит слева и накрывает низ обложки. */
body[data-p="fl"] .holst{
  width:960px; height:200px;
  --av-w:190px; --av-h:110px;
  --hrebet:190px; --otstup:26px; --pole-pravo:60px;
  --pole-verh:22px; --pole-niz:20px;
  --kegl-metka:13px; --kegl-tezis:33px; --kegl-delo:15px; --kegl-masshtab:12px;
  --glif-h:11px; --glif-w:3.5px; --glif-gap:4.5px; --glif-pole:11px 0 -2px;
}

/* ── Kwork: 960×113 CSS → 1920×226 PNG ────────────────────────────────────
   Полоса низкая: тезис в одну строку, глиф убран — на 113 px он съедает
   высоту, которой нет. Значимое держим в центральных ~65 % ширины. */
body[data-p="kwork"] .holst{
  width:960px; height:113px;
  --av-w:0px; --av-h:0px;
  --hrebet:168px; --otstup:24px; --pole-pravo:168px;
  --pole-verh:16px; --pole-niz:15px;
  /* 25px было ДО добавления тире: разделитель прибавил ~15 px ширины, и тезис вылез
     за центральные 65 % на 2,4 px — поймала проверка, а не глаз. 24.2 возвращает запас. */
  --kegl-metka:11.5px; --kegl-tezis:24.2px; --kegl-delo:13px; --kegl-masshtab:11px;
  --glif-h:0px; --glif-w:0px; --glif-gap:0px; --glif-pole:0;
}
/* ⛔ В двухстрочном макете поворот фразы отыгрывает глиф, и знак препинания там лишний.
   В одну строку глиф не влезает — без разделителя половины слипаются в «банкира вижу»
   и читаются как одно предложение (замечание Дмитрия 11.08.2026). Поэтому здесь тире,
   янтарное: цвет тот же, что у второй половины, — разделитель принадлежит ей. */
body[data-p="kwork"] .glif{ display:none }
body[data-p="kwork"] .tezis .vtoraya{ display:inline }
body[data-p="kwork"] .tezis .vtoraya::before{ content:"—"; margin:0 .38em 0 .34em }
body[data-p="kwork"] .tezis{ flex-direction:row; align-items:center; white-space:nowrap }

/* ── LinkedIn: 792×198 CSS → 1584×396 PNG (штатный размер фона) ────────────
   Аватар — круг в нижнем левом углу, накрывает низ баннера примерно
   на 200×100 CSS-пикселей. Колонка начинается правее. */
body[data-p="linkedin"] .holst{
  width:792px; height:198px;
  --av-w:200px; --av-h:100px;
  --hrebet:206px; --otstup:26px; --pole-pravo:44px;
  --pole-verh:21px; --pole-niz:19px;
  --kegl-metka:12.5px; --kegl-tezis:31px; --kegl-delo:14px; --kegl-masshtab:11.5px;
  --glif-h:10px; --glif-w:3.5px; --glif-gap:4.5px; --glif-pole:10px 0 -2px;
}
</style>
</head>
<body data-p="fl">

<div class="holst">
  <div class="hrebet"></div>

  <div class="kolonka">

    <div class="metka">
      <span class="rol">Внешний финансовый директор</span><span class="kanal">· ФИНДИР.МОСКВА</span>
    </div>

    <div class="tezis">
      <span>Смотрю взглядом банкира</span>
      <div class="glif"><i style="height:5px"></i><i style="height:5px"></i><i style="height:5px"></i><i style="height:5px"></i><i style="height:11px"></i><i style="height:5px"></i><i style="height:5px"></i><i style="height:5px"></i><i style="height:5px"></i></div>
      <span class="vtoraya">вижу суть изнутри</span>
    </div>

    <div class="niz">
      <span class="delo">Готовлю компанию и проекты к финансированию</span>
      <span class="masshtab">
        <b>30+</b> сделок<span class="tochka">·</span><b>200+</b> млрд ₽
      </span>
    </div>

  </div>
</div>

<script>
// Пресет задаётся из адресной строки: ?p=fl | kwork | linkedin
const p = new URLSearchParams(location.search).get('p');
if (p) document.body.dataset.p = p;
</script>
</body>
</html>
